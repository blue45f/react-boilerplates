# GitLab CI/CD Configuration
# Customize this file according to your deployment needs

image: node:20

stages:
  - install
  - build
  - test
  - deploy

variables:
  PNPM_VERSION: "8.11.0"

.pnpm-setup: &pnpm-setup
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store
    - node_modules/

install:
  stage: install
  <<: *pnpm-setup
  script:
    - pnpm install --frozen-lockfile

build:
  stage: build
  <<: *pnpm-setup
  needs:
    - install
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/

