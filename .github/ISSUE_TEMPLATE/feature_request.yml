name: ✨ 기능 제안
description: 새 기능이나 개선 아이디어를 제안합니다
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      placeholder: 어떤 상황에서 어떤 어려움이 있나요?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: dropdown
    id: scope
    attributes:
      label: 영향 범위
      multiple: true
      options:
        - templates/app
        - templates/admin
        - templates/lib
        - packages/configs
        - packages/cli
        - apps/docs
        - 루트 인프라
