version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tanstack:
        patterns: ['@tanstack/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*']
      storybook:
        patterns: ['storybook', '@storybook/*']
      vitest:
        patterns: ['vitest', '@vitest/*', '@testing-library/*']
      types:
        patterns: ['@types/*']
      dev-tooling:
        patterns: ['prettier', 'husky', 'lint-staged', '@changesets/*', '@commitlint/*']
    ignore:
      - dependency-name: 'node'

  - package-ecosystem: npm
    directory: '/templates/app'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['template/app', 'dependencies']

  - package-ecosystem: npm
    directory: '/templates/admin'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['template/admin', 'dependencies']

  - package-ecosystem: npm
    directory: '/templates/lib'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['template/lib', 'dependencies']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: ['ci']
