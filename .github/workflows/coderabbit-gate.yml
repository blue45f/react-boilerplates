name: CodeRabbit review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coderabbit-review-gate-${{ github.event.pull_request.number || github.event.review.pull_request_url || github.ref }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: CodeRabbit review gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft PRs don't get auto-reviewed by CodeRabbit (and shouldn't be
    # merged anyway), so skip the gate for them. PR template's
    # "Ready for review" transition will re-trigger this workflow.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review')
    steps:
      - name: Verify CodeRabbit reviewed the PR with no unresolved threads
        uses: actions/github-script@v9
        with:
          # CodeRabbit posts each review under a bot login. We accept any of
          # the historical login spellings so a future rename doesn't silently
          # turn the gate green.
          script: |
            const eventPr = context.payload.pull_request;
            const reviewPr = context.payload.review?.pull_request_url;
            let prNumber = eventPr?.number;
            if (!prNumber && typeof reviewPr === "string") {
              const m = reviewPr.match(/\/pulls\/(\d+)$/);
              if (m) prNumber = Number(m[1]);
            }
            if (!prNumber) {
              core.setFailed(
                "Could not determine PR number for the CodeRabbit gate."
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.draft) {
              core.notice(`PR #${prNumber} is draft; skipping CodeRabbit gate.`);
              return;
            }

            const headSha = pr.head?.sha;
            if (!headSha) {
              core.setFailed(`Could not determine head SHA for PR #${prNumber}.`);
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );

            // CodeRabbit's review author has changed spelling over time;
            // accept every variant we've seen in the wild.
            const codeRabbitLogins = new Set([
              "coderabbitai[bot]",
              "coderabbitai",
              "coderabbit-ai[bot]",
              "coderabbit[bot]",
            ]);
            const codeRabbitReviews = reviews.filter((r) =>
              codeRabbitLogins.has(r.user?.login ?? "")
            );
            if (codeRabbitReviews.length === 0) {
              core.setFailed(
                "CodeRabbit has not reviewed this PR yet. The gate stays red until " +
                  "CodeRabbit posts a review. If CodeRabbit is disabled for your repo, " +
                  "ask an admin to install the GitHub App."
              );
              return;
            }

            // Newest CodeRabbit review across the PR wins. CodeRabbit re-reviews
            // every push (auto_incremental_review), so a later clean review
            // supersedes an earlier CHANGES_REQUESTED.
            codeRabbitReviews.sort((a, b) => {
              const ta = new Date(a.submitted_at ?? 0).getTime();
              const tb = new Date(b.submitted_at ?? 0).getTime();
              return tb - ta;
            });
            const latest = codeRabbitReviews[0];
            const state = String(latest.state ?? "").toUpperCase();
            core.info(
              `Latest CodeRabbit review: state=${state} id=${latest.id} commit=${latest.commit_id} at=${latest.submitted_at}`
            );

            // CodeRabbit (profile: chill, request_changes_workflow: false) posts
            // COMMENTED reviews, never APPROVED. The gate therefore requires that
            // CodeRabbit reviewed and did NOT request changes, AND that every
            // CodeRabbit review thread is resolved — the same guarantee that
            // branch protection's required_conversation_resolution enforces on
            // the merge button, surfaced here as a status check.
            if (state === "CHANGES_REQUESTED") {
              core.setFailed(
                "CodeRabbit requested changes. Address the review comments and push a new commit — CodeRabbit will re-review and the gate will flip back to green."
              );
              return;
            }

            const threadData = await github.graphql(
              `query ($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes { isResolved comments(first: 1) { nodes { author { login } } } }
                    }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo, pr: prNumber }
            );
            const threads =
              threadData.repository.pullRequest.reviewThreads.nodes ?? [];
            const unresolvedCodeRabbit = threads.filter(
              (t) =>
                !t.isResolved &&
                codeRabbitLogins.has(t.comments?.nodes?.[0]?.author?.login ?? "")
            );

            await core.summary
              .addRaw(
                [
                  "## CodeRabbit review gate",
                  "",
                  `- PR: #${prNumber}`,
                  `- Head SHA: \`${headSha}\``,
                  `- Latest CodeRabbit review: \`${state}\` (id \`${latest.id}\`)`,
                  `- Unresolved CodeRabbit threads: \`${unresolvedCodeRabbit.length}\``,
                  "",
                ].join("\n")
              )
              .write();

            if (unresolvedCodeRabbit.length > 0) {
              core.setFailed(
                `${unresolvedCodeRabbit.length} unresolved CodeRabbit review thread(s). ` +
                  "Resolve them (or address and let CodeRabbit re-review) to turn the gate green."
              );
              return;
            }

            core.notice(
              `CodeRabbit reviewed PR #${prNumber} (state=${state}) with no unresolved threads — gate is green.`
            );
