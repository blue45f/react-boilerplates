name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PNPM_VERSION: 10.4.1

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: pnpm commitlint:check --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: pnpm commitlint:check --from "${{ github.event.before }}" --to "${{ github.sha }}"

  test:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook:bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: templates/lib/storybook-static
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (Playwright - ${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [app, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Install template deps
        working-directory: templates/${{ matrix.template }}
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Install Playwright browsers
        working-directory: templates/${{ matrix.template }}
        run: pnpm run test:e2e:install
      - name: Run E2E
        working-directory: templates/${{ matrix.template }}
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.template }}
          path: templates/${{ matrix.template }}/playwright-report
          retention-days: 7

  e2e-react-scaffolding:
    name: E2E (Playwright - react-scaffolding)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Install app deps
        run: pnpm --dir apps/react-scaffolding install --ignore-workspace --ignore-scripts
      - name: Install Playwright browsers
        run: pnpm --dir apps/react-scaffolding run test:e2e:install
      - name: Run E2E
        run: pnpm --dir apps/react-scaffolding run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-react-scaffolding
          path: apps/react-scaffolding/playwright-report
          retention-days: 7

  template-verify:
    name: Templates Verify (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [app, admin, lib]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Install template deps
        working-directory: templates/${{ matrix.template }}
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Run template verify
        working-directory: templates/${{ matrix.template }}
        run: pnpm run verify
