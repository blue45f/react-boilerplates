name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets PR / Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'blue45f/react-boilerplates'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Publish is enabled only when NPM_TOKEN repository secret is set.
      # Without it, changesets only opens/updates the "Version Packages" PR.
      - name: Create Release PR (or Publish if NPM_TOKEN set)
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: ${{ secrets.NPM_TOKEN && 'pnpm changeset:publish' || '' }}
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
