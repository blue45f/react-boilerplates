# Publishing configuration for create-boilerplate-app

stages:
  - prepare
  - publish

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

prepare-release:
  stage: prepare
  image: node:20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - packages/scaffolding/create-boilerplate-app/**/*
  script:
    - corepack enable
    - corepack prepare pnpm@8.11.0 --activate
    - pnpm install --frozen-lockfile
    - NEW_VERSION=$(node -p "require('./packages/scaffolding/create-boilerplate-app/package.json').version")
    - NEW_RELEASE_TAG="create-boilerplate-app/$NEW_VERSION"
    - 'echo "New version: create-boilerplate-app/${NEW_VERSION}"'
    - git config user.email "ci@boilerplate.dev"
    - git config user.name "CI Bot"
    - 'git commit -m "chore(create-boilerplate-app): prepare release ${NEW_VERSION}"'
    - git tag $NEW_RELEASE_TAG

publish:
  stage: publish
  needs: ["prepare-release"]
  script:
    - pnpm -F create-boilerplate-app publish --recursive --no-git-checks --tag latest
