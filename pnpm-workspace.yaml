packages:
  - 'apps/*'
  - 'packages/configs/*'
  - 'packages/cli/*'
  - '!**/dist/**'
  - '!**/node_modules/**'
  - '!templates/**'

# pnpm catalog: 워크스페이스 전체에서 공통으로 쓰는 의존성 버전을 한곳에서 관리한다.
# 각 패키지 package.json에서 "catalog:" 프로토콜로 참조한다. (pnpm 9.5+ 정식 지원, pnpm 10 권장)
catalog:
  # React
  react: ^19.1.0
  react-dom: ^19.1.0
  '@types/react': ^19.1.0
  '@types/react-dom': ^19.1.0

  # TypeScript & 빌드
  typescript: ^5.8.0
  vite: ^6.3.0
  '@vitejs/plugin-react': ^4.4.0
  vite-plugin-dts: ^4.5.0

  # 테스트
  vitest: ^3.1.0
  jsdom: ^26.1.0
  '@vitest/coverage-v8': ^3.1.0
  '@testing-library/react': ^16.3.0
  '@testing-library/jest-dom': ^6.6.3
  '@testing-library/user-event': ^14.6.0
  '@playwright/test': ^1.51.0

  # 린트
  eslint: ^9.24.0
  '@eslint/js': ^9.24.0
  typescript-eslint: ^8.30.0
  eslint-plugin-react-hooks: ^5.2.0
  eslint-plugin-react-refresh: ^0.4.19
  eslint-plugin-storybook: ^0.11.0
  globals: ^16.0.0

  # 상태/데이터
  zustand: ^5.0.0
  '@tanstack/react-query': ^5.74.0
  '@tanstack/react-query-devtools': ^5.74.0
  ky: ^1.7.0
  ofetch: ^1.4.1

  # 라우팅
  react-router-dom: ^7.5.0
  react-helmet-async: ^2.0.5

  # 폼/검증
  react-hook-form: ^7.55.0
  '@hookform/resolvers': ^4.1.0
  zod: ^3.24.0

  # 유틸
  clsx: ^2.1.1
  lucide-react: ^0.487.0
  dayjs: ^1.11.13

  # MSW
  msw: ^2.7.0

  # Storybook
  storybook: ^8.6.0
  '@storybook/react': ^8.6.0
  '@storybook/react-vite': ^8.6.0
  '@storybook/addon-essentials': ^8.6.0
  '@storybook/addon-a11y': ^8.6.0
  '@storybook/addon-interactions': ^8.6.0
  '@storybook/addon-themes': ^8.6.0
  '@storybook/addon-viewport': ^8.6.0
  '@storybook/blocks': ^8.6.0
  '@storybook/test': ^8.6.0
